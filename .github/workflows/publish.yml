#
# Publishes the registry on GitHub Pages (https://stein-project.github.io/registry/): every .json of the repository,
# with the files that follow the releases brought up to date first (tools/collect.sh: the mods' indexes, client.json
# and the installer's "latest" in stein.json), each with its ed25519 signature next to it (<file>.sig), signed here
# with the REGISTRY_SIGNING_KEY secret (the PEM private key). Runs on every push to main, by hand (Actions > publish >
# Run workflow) and every 15 minutes: the scheduled run collects the releases and publishes only when a file changed
# (compared with what is on Pages), so a release of any component reaches the registry by itself within minutes. No
# other repository writes here, so none needs a token for it. The clients refuse any file whose signature does not match the public key
# they carry, so a change that skips this workflow is simply not believed.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/collect.sh
      # A scheduled run publishes only what changed: every .json is compared with the published one (the signing step
      # copies them as they are). Push and manual runs always publish.
      - name: Changed since the last publish
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="https://stein-project.github.io/registry"
          changed=0
          while IFS= read -r f; do
            f="${f#./}"
            if ! curl -fsSL "$base/$f?nocache=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/published.json" || ! cmp -s "$f" "$RUNNER_TEMP/published.json"; then
              echo "changed: $f"
              changed=1
            fi
          done < <(git ls-files '*.json')  # the files tools/sign.sh publishes
          if [ "$changed" = 1 ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "nothing new"; echo "publish=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sign
        if: steps.changed.outputs.publish == 'true'
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          [ -n "$REGISTRY_SIGNING_KEY" ] || { echo "::error::the REGISTRY_SIGNING_KEY secret is missing"; exit 1; }
          key="$RUNNER_TEMP/registry.pem"
          # Removed however the step ends, a failed signing included.
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$REGISTRY_SIGNING_KEY" > "$key")
          bash tools/sign.sh "$key" _site
          rm -f "$key"
          bash tools/verify.sh _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.publish == 'true'
        with:
          path: _site
      - id: deploy
        if: steps.changed.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
